[project]
name = "island-finder-vision"
version = "0.1.0"
description = "Local OpenCV map-criteria analyzer for Island Finder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cv2-enumerate-cameras==1.3.3; sys_platform == 'win32'",
  "numpy==2.0.2",
  "onnxruntime>=1.29.0",
  "opencv-python==4.12.0.88",
  "pyserial==3.5",
  "rapidocr>=3.4,<4",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["vision_service/tests"]
pythonpath = ["vision_service"]
